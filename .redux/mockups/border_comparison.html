<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Auto-Border do Ground: Atual vs Proposto</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #1a1a1a;
    color: #ddd;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
    margin: 0;
    line-height: 1.5;
  }
  h1 { color: #fff; margin-top: 0; }
  h2 {
    color: #ffd54f;
    border-bottom: 2px solid #444;
    padding-bottom: 8px;
    margin-top: 48px;
  }
  h3 { color: #ccc; margin: 0 0 12px; font-size: 15px; }
  p { color: #bbb; max-width: 900px; }
  code {
    background: #0f0f0f;
    padding: 2px 6px;
    border-radius: 3px;
    color: #ffd54f;
    font-family: 'Consolas', monospace;
    font-size: 13px;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin: 16px 0 32px;
    font-size: 13px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch {
    width: 22px;
    height: 22px;
    border: 1px solid #000;
  }

  .scenario {
    margin-bottom: 48px;
    background: #222;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .scenario-desc {
    font-size: 14px;
    margin-bottom: 20px;
  }

  .comparison {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .case {
    background: #1a1a1a;
    padding: 16px;
    border-radius: 6px;
    border: 2px solid #444;
  }
  .case.atual { border-color: #c62828; }
  .case.proposto { border-color: #2e7d32; }
  .case-label {
    font-weight: bold;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .case.atual .case-label { color: #ef9a9a; }
  .case.proposto .case-label { color: #a5d6a7; }

  .map {
    display: grid;
    gap: 0;
    background: #000;
    padding: 2px;
    border-radius: 2px;
    width: fit-content;
  }
  .tile {
    width: 64px;
    height: 64px;
    overflow: hidden;
    position: relative;
    background: #8a857c;
  }
  .tile svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .note {
    background: #2a2a1a;
    border-left: 3px solid #ffd54f;
    padding: 12px 16px;
    margin-top: 24px;
    font-size: 13px;
    border-radius: 0 4px 4px 0;
  }

  .key-diff {
    background: #1a2a1a;
    border-left: 3px solid #66bb6a;
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 14px;
    border-radius: 0 4px 4px 0;
  }
</style>
</head>
<body>

<h1>Auto-Border do Ground — Atual vs Proposto</h1>

<p>
  Cada tile é um quadrado 64×64 px. As cores são uma aproximação simplificada das sprites reais do Tibia:
  o objetivo é mostrar a <strong>silhueta</strong> e onde a borda aparece em cada caso.
</p>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#6b1212"></div> Ground (vermelho)</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#c4940d"></div> Borda (dourada)</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#8a857c"></div> Piso de pedra</div>
</div>

<div id="scenarios"></div>

<script>
// ========================================================================
// CORES
// ========================================================================
const C_GROUND = '#6b1212';
const C_BORDER = '#c4940d';
const C_FLOOR  = '#8a857c';

// ========================================================================
// SPRITES
// Cada sprite é uma função que recebe o <svg> e desenha algo nele.
// Coordenadas: 0,0 no canto NW; 64,64 no canto SE.
// ========================================================================

// Tile sólido — todo preenchido por uma cor
function fillTile(svg, color) {
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', 0); r.setAttribute('y', 0);
  r.setAttribute('width', 64); r.setAttribute('height', 64);
  r.setAttribute('fill', color);
  svg.appendChild(r);
}

// Retângulo arbitrário
function rect(svg, x, y, w, h, color) {
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', x); r.setAttribute('y', y);
  r.setAttribute('width', w); r.setAttribute('height', h);
  r.setAttribute('fill', color);
  svg.appendChild(r);
}

// Polígono (pra triângulos diagonais)
function poly(svg, points, color) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  p.setAttribute('points', points);
  p.setAttribute('fill', color);
  svg.appendChild(p);
}

// === Sprites do sistema ATUAL ===
// Cada uma representa visualmente uma sprite de borda.

// Cardeais — tira de borda de 12px no lado correspondente
const SPR = {
  // Ground sólido
  GROUND: (svg) => fillTile(svg, C_GROUND),
  FLOOR:  (svg) => fillTile(svg, C_FLOOR),

  // Cardeais (lado externo do ground)
  N: (svg) => rect(svg, 0, 0, 64, 12, C_BORDER),
  S: (svg) => rect(svg, 0, 52, 64, 12, C_BORDER),
  W: (svg) => rect(svg, 0, 0, 12, 64, C_BORDER),
  E: (svg) => rect(svg, 52, 0, 12, 64, C_BORDER),

  // Outer corners (quadrantes pequenos)
  NW_CORNER: (svg) => rect(svg, 0, 0, 12, 12, C_BORDER),
  NE_CORNER: (svg) => rect(svg, 52, 0, 12, 12, C_BORDER),
  SW_CORNER: (svg) => rect(svg, 0, 52, 12, 12, C_BORDER),
  SE_CORNER: (svg) => rect(svg, 52, 52, 12, 12, C_BORDER),

  // === O VILÃO ===
  // Diagonais "atravessando o tile" — sistema atual usa quando 2 cardeais opostos
  // têm ground. Cobre METADE do tile com cor de borda.
  NW_DIAGONAL: (svg) => {
    poly(svg, '0,0 64,0 0,64', C_BORDER);            // metade NW dourada
  },
  NE_DIAGONAL: (svg) => {
    poly(svg, '0,0 64,0 64,64', C_BORDER);            // metade NE dourada
  },
  SW_DIAGONAL: (svg) => {
    poly(svg, '0,0 64,64 0,64', C_BORDER);            // metade SW dourada
  },
  SE_DIAGONAL: (svg) => {
    poly(svg, '64,0 64,64 0,64', C_BORDER);            // metade SE dourada
  },

  // === Versão PROPOSTA: inner corner pequeno em vez de diagonal cheia ===
  // Só preenche o quadrante (16x16) do canto interno, em vez de metade do tile.
  NW_INNER_SMALL: (svg) => rect(svg, 0, 0, 16, 16, C_BORDER),
  NE_INNER_SMALL: (svg) => rect(svg, 48, 0, 16, 16, C_BORDER),
  SW_INNER_SMALL: (svg) => rect(svg, 0, 48, 16, 16, C_BORDER),
  SE_INNER_SMALL: (svg) => rect(svg, 48, 48, 16, 16, C_BORDER),
};

// ========================================================================
// RENDERER
// ========================================================================
function renderMap(container, rows, cols, tilesData) {
  const map = document.createElement('div');
  map.className = 'map';
  map.style.gridTemplateColumns = `repeat(${cols}, 64px)`;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 64 64');

      const sprites = tilesData[r * cols + c] || ['FLOOR'];
      sprites.forEach(name => SPR[name](svg));

      tile.appendChild(svg);
      map.appendChild(tile);
    }
  }
  container.appendChild(map);
}

// ========================================================================
// CENÁRIOS
// ========================================================================
const scenarios = [
  // -------------------------------------------------------------------
  {
    title: 'Cenário 1 — Forma quadrada 3×3 (CONTROLE)',
    desc: 'Caso simples: bloco vermelho 3×3 cercado de piso de pedra. <strong>Atual e proposto dão o mesmo resultado.</strong> Bom pra verificar que a mudança não quebra os casos normais.',
    cols: 5, rows: 5,
    atual: [
      [['FLOOR'],    ['SE_CORNER'], ['S'],      ['SW_CORNER'],['FLOOR']],
      [['SE_CORNER'],['GROUND'],    ['GROUND'], ['GROUND'],   ['SW_CORNER']],
      [['E'],        ['GROUND'],    ['GROUND'], ['GROUND'],   ['W']],
      [['NE_CORNER'],['GROUND'],    ['GROUND'], ['GROUND'],   ['NW_CORNER']],
      [['FLOOR'],    ['NE_CORNER'], ['N'],      ['NW_CORNER'],['FLOOR']],
    ],
    proposto: null,
  },

  // -------------------------------------------------------------------
  {
    title: 'Cenário 2 — Pico diagonal (CASO PROBLEMÁTICO)',
    desc: 'Quando a forma tem uma "ponta" diagonal — tipo a imagem que você mandou (imagem 1). <strong>O sistema atual desenha uma fatia diagonal cobrindo metade do tile</strong>, criando aquele corte feio. <strong>O proposto desenha só um cantinho pequeno</strong>, deixando a silhueta limpa.',
    cols: 5, rows: 5,
    // Configuração do ground:
    //  . . X . .
    //  . X X . .
    //  . X . . .
    //  X X . . .
    //  X . . . .
    atual: [],
    proposto: []
  },

  // -------------------------------------------------------------------
  {
    title: 'Cenário 3 — Tile vazio rodeado por ground em 3 lados',
    desc: 'Forma em "U" — o tile vazio no meio tem ground em N, W e NW. <strong>Atual usa fatia diagonal grande</strong>; <strong>proposto usa inner corner pequeno</strong> só onde realmente precisa.',
    cols: 4, rows: 3,
    atual: [],
    proposto: []
  },

  // -------------------------------------------------------------------
  {
    title: 'Cenário 4 — Pixel isolado em diagonal (CASO AMBÍGUO)',
    desc: 'Dois tiles vermelhos conectados apenas pelo canto. Esse é o caso que perguntei antes: <strong>renderizar o canto pequeno conectando os dois, ou deixar totalmente isolados?</strong>',
    cols: 5, rows: 5,
    atual: [],
    proposto: []
  },
];

// === Cenário 2: monta as duas versões ===
function buildScenario2() {
  const s = scenarios[1];
  // Layout: . . X . .  (X = ground)
  //         . X X . .
  //         . X . . .
  //         X X . . .
  //         X . . . .

  // === ATUAL ===
  s.atual = [
    [['FLOOR'],                  ['NW_CORNER'],               ['GROUND'],                ['NE_CORNER'],             ['FLOOR']],
    [['NW_CORNER'],              ['GROUND'],                  ['GROUND'],                ['SE_DIAGONAL'],          ['FLOOR']],
    [['FLOOR'],                  ['GROUND'],                  ['NE_DIAGONAL'],          ['FLOOR'],                 ['FLOOR']],
    [['NW_CORNER'],              ['GROUND'],                  ['SW_CORNER'],             ['FLOOR'],                 ['FLOOR']],
    [['GROUND'],                 ['SE_DIAGONAL'],            ['FLOOR'],                 ['FLOOR'],                 ['FLOOR']],
  ];

  // === PROPOSTO ===
  // mesma config, mas tiles "ponte" usam canto pequeno em vez de diagonal grande
  s.proposto = [
    [['FLOOR'],                  ['NW_CORNER'],               ['GROUND'],                ['NE_CORNER'],             ['FLOOR']],
    [['NW_CORNER'],              ['GROUND'],                  ['GROUND'],                ['SW_INNER_SMALL'],        ['FLOOR']],
    [['FLOOR'],                  ['GROUND'],                  ['NW_INNER_SMALL'],        ['FLOOR'],                 ['FLOOR']],
    [['NW_CORNER'],              ['GROUND'],                  ['SW_CORNER'],             ['FLOOR'],                 ['FLOOR']],
    [['GROUND'],                 ['NW_INNER_SMALL'],          ['FLOOR'],                 ['FLOOR'],                 ['FLOOR']],
  ];
}
buildScenario2();

// === Cenário 3: U em volta de tile vazio ===
function buildScenario3() {
  const s = scenarios[2];
  // Layout: X X X X
  //         X . . X      <- tile vazio no meio com ground em N, W e NW
  //         X X X X

  // ATUAL: o tile vazio recebe NW_DIAGONAL + NE_DIAGONAL combinados (= dois meio-tiles dourados)
  // que cobrem ~70% da área do tile, "puxando" a borda pra dentro
  s.atual = [
    [['GROUND'],   ['GROUND'],   ['GROUND'],   ['GROUND']],
    [['GROUND'],   ['NW_DIAGONAL','NE_DIAGONAL'], ['NE_DIAGONAL','NW_DIAGONAL'], ['GROUND']],
    [['GROUND'],   ['GROUND'],   ['GROUND'],   ['GROUND']],
  ];

  // PROPOSTO: o tile vazio só recebe inner corners pequenos nos cantos
  s.proposto = [
    [['GROUND'],   ['GROUND'],   ['GROUND'],   ['GROUND']],
    [['GROUND'],   ['NW_INNER_SMALL','NE_INNER_SMALL','SW_INNER_SMALL','SE_INNER_SMALL'], ['NW_INNER_SMALL','NE_INNER_SMALL','SW_INNER_SMALL','SE_INNER_SMALL'], ['GROUND']],
    [['GROUND'],   ['GROUND'],   ['GROUND'],   ['GROUND']],
  ];
}
buildScenario3();

// === Cenário 4: tiles conectados em diagonal ===
function buildScenario4() {
  const s = scenarios[3];
  // Layout:
  // . . . . .
  // . X . . .
  // . . X . .
  // . . . . .
  // . . . . .

  s.atual = [
    [['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR']],
    [['NW_CORNER'],     ['GROUND'],        ['NE_CORNER','SE_DIAGONAL'], ['FLOOR'],         ['FLOOR']],
    [['FLOOR'],         ['NW_CORNER','SE_DIAGONAL'], ['GROUND'],        ['NE_CORNER'],     ['FLOOR']],
    [['FLOOR'],         ['SW_CORNER'],     ['S','SE_CORNER'], ['FLOOR'],         ['FLOOR']],
    [['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR']],
  ];

  s.proposto = [
    [['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR']],
    [['NW_CORNER'],     ['GROUND'],        ['SW_INNER_SMALL'],['FLOOR'],         ['FLOOR']],
    [['FLOOR'],         ['NE_INNER_SMALL'],['GROUND'],        ['NE_CORNER'],     ['FLOOR']],
    [['FLOOR'],         ['FLOOR'],         ['S','SE_CORNER'], ['FLOOR'],         ['FLOOR']],
    [['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR'],         ['FLOOR']],
  ];
}
buildScenario4();

// ========================================================================
// RENDER
// ========================================================================
const container = document.getElementById('scenarios');

scenarios.forEach(s => {
  const div = document.createElement('div');
  div.className = 'scenario';

  const h = document.createElement('h2');
  h.textContent = s.title;
  div.appendChild(h);

  const p = document.createElement('p');
  p.className = 'scenario-desc';
  p.innerHTML = s.desc;
  div.appendChild(p);

  const comp = document.createElement('div');
  comp.className = 'comparison';

  // ATUAL
  const c1 = document.createElement('div');
  c1.className = 'case atual';
  const l1 = document.createElement('div');
  l1.className = 'case-label';
  l1.textContent = '❌ ATUAL';
  c1.appendChild(l1);
  // flatten 2D array
  const flatAtual = s.atual.flat();
  renderMap(c1, s.rows, s.cols, flatAtual);
  comp.appendChild(c1);

  // PROPOSTO
  const c2 = document.createElement('div');
  c2.className = 'case proposto';
  const l2 = document.createElement('div');
  l2.className = 'case-label';
  l2.textContent = '✓ PROPOSTO';
  c2.appendChild(l2);
  const flatProp = (s.proposto || s.atual).flat();
  renderMap(c2, s.rows, s.cols, flatProp);
  comp.appendChild(c2);

  div.appendChild(comp);
  container.appendChild(div);
});

// ========================================================================
// EXPLICAÇÃO FINAL
// ========================================================================
const exp = document.createElement('div');
exp.innerHTML = `
  <h2>Resumo da mudança</h2>
  <div class="key-diff">
    <strong>O coração da diferença</strong>: o sistema atual usa sprites de "diagonal" (<code>NW_DIAGONAL</code>, etc.)
    que cobrem <strong>metade do tile</strong> com cor de borda. O sistema proposto substitui essas diagonais
    por <strong>inner corners pequenos</strong> (16×16 px) que só ocupam o cantinho onde a transição realmente acontece.
  </div>
  <div class="note">
    <strong>Importante:</strong> esse mockup é uma simplificação. As sprites reais do Tibia têm pixels irregulares
    (parecem "pelos" ou "grama"), mas o princípio geométrico é exatamente esse: a área coberta pela transição
    é menor no proposto, dando aquela silhueta limpa da imagem 3 que você mandou.
  </div>
`;
container.appendChild(exp);
</script>

</body>
</html>
